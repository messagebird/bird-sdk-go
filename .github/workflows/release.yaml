# Cuts a GitHub Release and warms the Go module proxy when a vX.Y.Z tag is pushed
# to this mirror. Go has no package registry: the tag itself is the published
# artifact (the module proxy serves it), so there is nothing to upload — this
# workflow just makes the release visible and proves the tag is installable.
#
# Source of truth: clients/sdk-go/.mirror/ in the Bird monorepo — do NOT edit on
# the mirror; changes are synced from the monorepo by scripts/dev/sdk-release.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GitHub Release runs BEFORE the smoke test: the tag is the published
      # Go artifact, so once it is pushed the release notes must land regardless
      # of a proxy-propagation flake in the smoke step below.
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Skip if the release already exists, so a re-run doesn't 422.
        # --notes-from-tag reuses the annotated tag's message (this version's
        # CHANGELOG section, set by scripts/dev/sdk-release.sh).
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --notes-from-tag --verify-tag

      - name: Warm the module proxy and smoke test
        if: github.event_name == 'push'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # No proxy warm-up here: proxy.golang.org negative-caches a miss, so a
          # pre-flight request for a tag it has not indexed yet records the very
          # "unknown revision" the smoke test then polls. smoke.sh's own retries
          # do the waiting, and `go get` triggers indexing just as well.
          ./scripts/smoke.sh "$ver"
